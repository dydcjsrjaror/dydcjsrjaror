<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST69 Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: rgba(255, 255, 255, 0.1); padding: 3rem; border-radius: 20px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        h1 { font-size: 3rem; margin-bottom: 0.5rem; letter-spacing: -1px; }
        p { font-size: 1.2rem; opacity: 0.9; }
        .status { display: inline-block; padding: 0.5rem 1rem; background: #48bb78; border-radius: 50px; font-weight: bold; margin-top: 1rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="card">
        <h1>TEST69 SERVER</h1>
        <p>CI/CD + Docker + Nginx + Watchtower</p>
        <div class="status">● SYSTEM ACTIVE</div>
        <p style="margin-top: 2rem; font-size: 0.9rem;">Managed by Admin: <strong>dydcjsrjaror</strong></p>
    </div>
</body>
</html>
