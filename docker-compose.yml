version: '3.8'
services:
  web:
    image: dydcjsrjaror/my-web:latest
    container_name: my-web-app
    restart: always

  proxy:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: always
