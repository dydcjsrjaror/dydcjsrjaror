name: Docker Build and Push

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # 이건 GitHub에서 공식적으로 만든 코드를 가져오는 기능입니다 (수정 금지)
        uses: actions/checkout@v3

      - name: Login to DockerHub
        # 이것도 공식 로그인 기능입니다 (수정 금지)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        # 이것도 공식 빌드 기능입니다 (수정 금지)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 여기에 관리자님의 Docker Hub 아이디/이미지이름을 적으세요!
          tags: dydcjsrjaror/my-web:latest
